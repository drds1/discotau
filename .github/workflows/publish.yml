name: Publish to PyPI

# Builds the sdist and wheel and uploads them to PyPI whenever a GitHub
# release is published (Releases -> "Draft a new release", tag e.g. v0.1.0).
# Uses PyPI trusted publishing (OIDC), so no API token is stored in the repo:
# register this repository/workflow as a trusted publisher on PyPI once
# first (pypi.org -> your account -> Publishing -> add a pending publisher:
# project "discotau", owner "drds1", repository "discotau", workflow
# "publish.yml", environment "pypi").
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/discotau
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
